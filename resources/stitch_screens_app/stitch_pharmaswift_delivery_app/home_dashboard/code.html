<body class="bg-background text-on-background min-h-screen pb-24 antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding h-16 bg-surface shadow-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Nova Pharma</span>
</div>
</div>
<div class="flex items-center gap-4">
<button aria-label="Cart" class="relative p-2 rounded-full hover:bg-secondary-container/50 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="shopping_cart">shopping_cart</span>
<span class="absolute top-1 right-1 flex h-4 w-4 items-center justify-center rounded-full bg-error text-[10px] font-bold text-on-error ring-2 ring-surface">2</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 px-container-padding flex flex-col gap-stack-gap-lg max-w-md mx-auto md:max-w-3xl md:grid md:grid-cols-12 md:gap-x-grid-gutter md:px-6">
<!-- Welcome & Delivery Info -->
<section class="md:col-span-12 flex flex-col gap-1">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Hello, Alex</h1>
<div class="flex items-center gap-1.5 text-on-surface-variant font-body-sm text-body-sm">
<span class="opacity-80">Deliver to:</span>
<button class="flex items-center gap-1 font-medium hover:text-primary transition-colors">
<span class="">Home - 123 Main St</span>
<span class="material-symbols-outlined text-[16px]">expand_more</span>
</button>
</div>
</section>
<!-- Search Bar -->
<section class="md:col-span-12 relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
<input class="w-full h-12 pl-12 pr-12 rounded-full bg-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder-on-surface-variant shadow-[0px_4px_20px_rgba(0,128,128,0.06)] transition-all" placeholder="Search medicine, vitamins..." type="text">
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-primary hover:text-primary-container transition-colors">
<span class="material-symbols-outlined">document_scanner</span>
</button>
</section>
<!-- Banners (Bento Grid Style) -->
<section class="md:col-span-12 grid grid-cols-1 md:grid-cols-2 gap-4">

<div class="z-10 flex flex-col gap-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary-fixed-dim" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-label-md text-label-md uppercase tracking-wider text-tertiary-fixed-dim">Express</span>
</div>

</div>
</div>

<h3 class="font-headline-md text-headline-md text-primary">Upload Prescription</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant opacity-80">For quick order processing</p>
</div>
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center shrink-0 shadow-sm">
<span class="material-symbols-outlined text-on-primary">upload_file</span>

</div>
</div>

<span class="font-body-sm text-body-sm text-on-surface-variant opacity-80">1000mg - 60 Gummies</span>
</div>
<div class="flex items-center justify-between mt-auto">
<span class="font-headline-md text-headline-md text-primary">$12.00</span>
<button aria-label="Add to cart" class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-sm hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-safe h-20 bg-surface shadow-[0px_-4px_20px_rgba(0,128,128,0.06)] rounded-t-xl md:hidden">
<button aria-label="Home" class="flex flex-col items-center justify-center bg-secondary-container text-primary rounded-full px-4 py-1 scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<button aria-label="Shop" class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="medical_services">medical_services</span>

</button>
<button aria-label="Prescriptions" class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors">
