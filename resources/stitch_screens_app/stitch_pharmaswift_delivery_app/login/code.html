<body class="min-h-screen flex flex-col antialiased">
<main class="flex-grow flex items-center justify-center p-container-padding">
<div class="w-full max-w-[400px] bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,128,128,0.06)] p-stack-gap-lg border border-[#F1F5F9]">
<div class="flex flex-col items-center mb-stack-gap-lg">
<div class="h-16 w-16 bg-primary-container rounded-full flex items-center justify-center mb-stack-gap-md shadow-sm">
<span class="material-symbols-outlined fill text-on-primary-container text-3xl" data-icon="health_and_safety">health_and_safety</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary mb-stack-gap-sm">Nova Pharma</h1>
<p class="font-headline-md text-headline-md text-on-surface">Welcome Back</p>
</div>
<form class="space-y-stack-gap-md" onsubmit="event.preventDefault();">
<div>
<label class="sr-only font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary placeholder-on-surface-variant/50 transition-shadow" id="email" placeholder="Email address" required="" type="email">
</div>
</div>
<div>
<label class="sr-only font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary placeholder-on-surface-variant/50 transition-shadow" id="password" placeholder="Password" required="" type="password">
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer">
<span class="material-symbols-outlined text-outline-variant hover:text-primary transition-colors" data-icon="visibility">visibility</span>
</div>
</div>
</div>
<div class="flex items-center justify-end">
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary active:scale-[0.98] transition-all h-[52px] items-center mt-stack-gap-lg" type="submit">
                    Login
                </button>
</form>
<div class="mt-stack-gap-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? <a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors ml-1" href="#">Register here</a>
</p>
</div>
</div>
