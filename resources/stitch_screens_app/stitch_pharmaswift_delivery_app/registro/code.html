<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">

<title>MedExpress - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Input Styling */
        .form-input-pill {
            @apply w-full h-[48px] px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center font-sans antialiased text-on-background px-container-padding py-safe">
<!-- Main Registration Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,128,128,0.06)] overflow-hidden flex flex-col relative z-10">
<!-- Header Section -->
<header class="px-container-padding py-stack-gap-lg flex flex-col items-center text-center border-b border-surface-variant/50">
<div class="w-12 h-12 bg-surface-container flex items-center justify-center rounded-full mb-stack-gap-sm">
<span class="material-symbols-outlined text-primary text-3xl">medical_services</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-1">Create Account</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Join MedExpress for seamless healthcare access.</p>
</header>
<!-- Form Section -->
<form class="flex-1 px-container-padding py-stack-gap-lg flex flex-col gap-stack-gap-md" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">person</span>
</div>
<input class="form-input-pill pl-10" id="fullName" placeholder="Jane Doe" required="" type="text">
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="form-input-pill pl-10" id="email" placeholder="jane@example.com" required="" type="email">
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="phone">Phone Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">call</span>
</div>
<input class="form-input-pill pl-10" id="phone" placeholder="(555) 123-4567" required="" type="tel">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="form-input-pill pl-10 pr-10" id="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-outline mt-1 ml-1">Must be at least 8 characters long.</p>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start mt-stack-gap-sm">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary focus:ring-2" id="terms" required="" type="checkbox">
</div>
<label class="ml-2 font-body-sm text-body-sm text-on-surface-variant" for="terms">
                    I agree to the <a class="text-primary font-medium hover:underline" href="#">Terms &amp; Conditions</a> and <a class="text-primary font-medium hover:underline" href="#">Privacy Policy</a>.
                </label>
</div>
<!-- Submit Button -->
<div class="mt-stack-gap-sm">
<button class="w-full h-[52px] bg-primary text-on-primary font-body-md text-body-md font-semibold rounded-lg shadow-sm hover:bg-surface-tint active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                    Sign Up
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Section -->
<footer class="px-container-padding py-stack-gap-md bg-surface-container-low text-center border-t border-surface-variant/50">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-semibold hover:underline ml-1" href="#">Log in here</a>
</p>
</footer>
</main>
<!-- Ambient Background Element -->
<div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none opacity-40">
<div class="absolute -top-[20%] -right-[10%] w-[500px] h-[500px] rounded-full bg-primary-fixed-dim blur-[100px] opacity-20"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[400px] h-[400px] rounded-full bg-secondary-fixed-dim blur-[100px] opacity-20"></div>
</div>
</body></html>
